[project]
name = "game"
version = "0.1.0"
description = "코딩형 던전 RPG — 결정론적 시뮬레이션 코어"
requires-python = ">=3.11"

# TDD §1.2 — Phase 1 프로토타입은 표준 라이브러리만 쓴다.
# 이 구간의 코드는 명시적으로 '버릴 코드'이고, Phase 3 에서 TypeScript 로 재작성된다.
# 살아남는 것은 규칙 DSL 스키마와 밸런스 JSON 뿐이므로(TDD §1.2) 런타임 의존성을
# 늘리지 않는다. 의존성이 필요해지면 그것이 곧 이관 비용(R4)이다.
dependencies = []

[dependency-groups]
# 검증 서버 (B단계). **시뮬레이션 코어는 여전히 의존성이 0개다** — 코어를 부르는 쪽에만
# 붙는다. TDD §1.2 가 '버릴 코드' 로 규정했던 파이썬 코어는 이제 검증 서버로 살아남으며
# (docs/설계/3_저장과_멀티플레이 §1), 그 껍데기만 여기 의존한다.
#
# 버전을 고정하는 이유는 §7.1 이다 — 로컬과 컨테이너가 같은 것을 봐야 한다.
api = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "psycopg[binary,pool]==3.2.3",
]
dev = [
    # §7.1 — 훅·pre-commit·게이트가 같은 ruff 를 봐야 한다. 핀은 §8.5.2 기준.
    "ruff==0.16.3",
    "pydoclint",
    "mypy",
    "pre-commit",
    # TDD §10 — 골든 리플레이·룸 생성 검증을 CI 매 커밋으로 돌린다.
    "pytest",
    # 검증 서버 검사에 필요하다. TestClient 가 httpx 를 쓴다.
    "httpx",
    {include-group = "api"},
]

# [tool.ruff] 를 여기에 두지 않는다. ruff 는 ruff.toml 을 pyproject.toml 보다
# 우선하므로 둘을 함께 두면 이 절이 조용히 무효가 된다 (표준 문서 §8).
# ruff 설정의 유일한 자리는 ruff.toml 이다.

[tool.pytest.ini_options]
testpaths = ["tests"]
# 저장소 루트를 import 경로에 넣는다. 이 프로토타입은 설치 가능한 패키지로 만들지
# 않는다 — 빌드 백엔드를 붙이는 값이 버릴 코드(TDD §1.2)에는 남지 않기 때문이다.
pythonpath = ["."]
