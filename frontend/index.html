<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- viewport-fit=cover 없이는 env(safe-area-inset-*) 이 전부 0 이 되어
         펀치홀·둥근 모서리·제스처 바 아래로 내용이 들어간다. -->
    <meta name="theme-color" content="#0E131C" />
    <meta name="color-scheme" content="dark" />
    <!-- 이름 셋이 한 줄에 선다: 한글(비각) · 한자(祕閣) · 뜻을 푼 영문(Sealed Stacks).
         祕閣 은 임금의 서고다 — 碑閣(비석을 덮은 집)이 아니다. 현대 한국어에서는
         碑閣 쪽으로 읽히므로 한자를 안 붙이면 다른 뜻이 된다.
         `stacks` 는 도서관의 서가이고 `closed/restricted stacks` 가 열람 제한
         서고다 — 祕(잠근)+閣(서가)을 실제 도서관 영어로 옮긴 말이다. -->
    <title>비각 祕閣 · Sealed Stacks</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
