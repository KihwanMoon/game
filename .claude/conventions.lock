# 표준 동기화 결과 (§10.2 11단계)
# 이 파일은 이력 추적용이다. 다음 실행 시 조회 기준으로 쓰지 않는다.

ruleset_version = 14
synced_at = "2026-08-28"

# 정본 문서 — 라벨 조회(§10.1)를 쓰지 못했다.
# Atlassian MCP 서버가 연결 실패 상태(HTTP 405)여서 searchConfluenceUsingCql 을
# 실행할 수 없었고, 사용자가 같은 문서의 PDF 내보내기를 직접 제공했다.
# 페이지 ID 는 저장소에 저장하지 않는다(§10.1) — 아래는 사용한 원본의 식별 정보다.
source_kind  = "pdf-export"
source_title = "[표준] 파이썬 코드 작성 규칙 및 Claude Code 자동 적용 절차"
source_label = "python-coding-standard"
source_file  = "docs/OAL-[표준] 파이썬 코드 작성 규칙 및 Claude Code 자동 적용 절차-280826-191909.pdf"

# 고른 트리거 (§8.5.1)
trigger = "git pre-push (.githooks/pre-push)"
trigger_enabled_by = "git config core.hooksPath .githooks"

# 도입한 선택 검사
optional_pre_commit     = true   # §8.3
optional_check_structure = true  # §8.9 구조 검사
optional_mypy           = true   # §8.9 타입 검사기

# 도구 버전 (§7.1 — 세 계층이 같은 값을 봐야 한다)
ruff       = "0.16.3"   # §8.5.2 핀과 일치 확인함
pydoclint  = "0.9.1"
mypy       = "2.3.1"
pre_commit = "4.6.2"

# 저장소 로컬 수정 — 정본 개정(RULESET_VERSION 15) 후 되돌린다
#
# §11 은 저장소에서 우회하지 말고 정본에 보고하라고 규정한다. 아래는 우회가 아니라
# 게이트가 아예 돌지 않는 상태를 푼 것이며, 규칙을 완화하지 않았다. 정본이 개정되면
# 이 수정들을 지우고 재동기화한다.
#
# D1. §8.5 check_all.sh: `python` -> `python3`
#     이 기기를 포함해 다수의 리눅스 배포판은 python3 만 제공한다. xargs 가 127 로
#     죽어 게이트가 영구히 실패했다. §8.3 주석이 같은 함정을 이미 경고하고 있다.
# D2. §8.5 check_all.sh: check_naming 파이프라인의 grep 에 `|| true`
#     grep 은 선택된 줄이 0개면 1 을 반환하고, 파이프라인이 set -o pipefail 아래라
#     "검사 대상 없음"이 곧 게이트 실패가 됐다.
# D3. §8.5 / §8.3 의 예외 정규식 `/tests/` -> `(^|/)tests/` (migrations 도 동일)
#     저장소 루트의 tests/ 가 걸러지지 않았다. §8.1 은 `**/tests/**` 로 올바른데
#     pydoclint --exclude, check_naming grep, pre-commit exclude 는 앞의 슬래시를
#     요구해 루트 디렉터리를 놓친다. §1 이 경고한 "한 곳만 고치면 나머지가 실패한다"가
#     정본 자체에 있다. 테스트 헬퍼를 `assert_*` 로 지으면 check_naming 이 막는다.
# D4. §8.3 + §8.5.3 동시 도입 충돌 — .githooks/pre-commit 을 직접 기록해 해소
#     core.hooksPath 가 설정되면 pre-commit install 이 거부한다. 정본은 두 선택지를
#     독립적으로 제시할 뿐 이 충돌을 다루지 않는다.

# 미해결 — 정본 문서 확인 필요
#
# D5. §8.9 check_structure.sh 의 BANNED 값이 PDF 내보내기에서 `etc` 뒤로 잘렸다.
#     Confluence 원문에서 뒷부분을 확인해 복원해야 한다.
