# 프런트 자리표시자. 실제 규칙 에디터·전투 렌더러는 Phase 3 (W11~W13) 산출물이다.
#
# 이 컨테이너가 /api/ 까지 받는 이유:
#   Cloudflare Tunnel 의 ingress 가 stock.nullmovie.com 전체를 host:8090 하나로 보낸다.
#   경로별 분기가 터널 쪽에 없으므로 여기서 나눠야 한다. 기존 stock 스택도 같은 구조였다
#   (Vite dev server 가 BACKEND_ORIGIN 으로 /api 를 프록시했다).
server {
    listen 8090;
    server_name _;

    # 도커 임베디드 DNS. 변수로 받아야 backend 재시작 시 IP 를 다시 해석한다.
    # 고정 이름을 그대로 쓰면 기동 시점에 한 번 굳어 stale 502 가 난다.
    resolver 127.0.0.11 valid=30s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        set $game_backend game-backend-1:8000;
        proxy_pass http://$game_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 틱 스트림(SSE)을 대비해 버퍼링을 끄고 오래 유지한다. 디자인의 로그 패널이
        # 틱 단위 실시간 갱신을 전제로 한다.
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
