# 백엔드 자리표시자. 실제 API 는 없다 — 로드맵 Phase 3 (W9~W13) 산출물이다.
# edge-proxy 가 /api/ 를 이 컨테이너의 8000 으로 넘기는 경로가 살아 있는지만 증명한다.
#
# proxy_pass 가 변수 형태라 nginx 는 경로를 그대로 넘긴다. 즉 여기 도착하는 URI 는
# /api/... 이다. 접두어를 떼지 않는다.
server {
    listen 8000;
    server_name _;

    location = /api/health {
        default_type application/json;
        return 200 '{"status":"ok","service":"game-backend","stage":"placeholder"}\n';
    }

    # 그 외 API 는 아직 없다. 200 으로 거짓말하지 않는다.
    location /api/ {
        default_type application/json;
        return 501 '{"error":"not_implemented","detail":"backend is a routing placeholder; see roadmap Phase 3"}\n';
    }

    location / {
        return 404;
    }
}
