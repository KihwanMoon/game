# 표준 문서 §12 가 정한 자리다. 저장소 루트에서 부른다.
#
#   docker compose -f deploy/docker-compose.yml up -d          # 서빙 스택
#   docker compose -f deploy/docker-compose.yml run --rm check # 일회성 도구
#
# 빌드 컨텍스트가 저장소 루트(..)인 이유는 Dockerfile 이 game/·pyproject.toml 을
# 읽어야 하기 때문이다. 컴포즈 파일 기준 상대경로다.
name: coding-roguelike

x-build: &build
  context: ..
  dockerfile: deploy/Dockerfile
  args:
    APP_UID: ${APP_UID:-1000}
    APP_GID: ${APP_GID:-1000}

services:

  # ══ 서빙 스택 — up -d 로 띄운다 ═══════════════════════════════════════════
  #
  # edge-proxy 가 컨테이너명으로 프록시하므로 container_name 을 고정한다.
  # 자동 생성 이름(coding-roguelike-frontend-1)에 기대면 프로젝트명이 바뀌는 순간
  # 프록시가 깨진다. stock 스택이 같은 이유로 같은 규약을 쓴다.
  #
  # 호스트 8090 을 연다. Cloudflare Tunnel 의 ingress 가 stock.nullmovie.com 을
  # host:8090 으로 직접 보내기 때문이다 — edge-proxy(:80)를 거치지 않는다.
  # 기존 stock 스택이 8090 을 열었던 이유도 같다.

  # ── 프런트 (실제 앱) ──────────────────────────────────────────────────────
  # 규칙 에디터 · 전투 관전 · 사후 분석 (Phase 3 W11~W13). `frontend/` 를 vite 로 굽고
  # nginx 가 정적 산출물을 서빙한다.
  #
  # **개발 서버(vite dev)가 아니라 프로덕션 빌드를 서빙한다.** 이 컨테이너가 서는 자리가
  # 공개 도메인(stock.nullmovie.com)이기 때문이다.
  #   - dev 서버는 HMR 웹소켓을 요구하는데 그 경로가 Cloudflare Tunnel 을 건너야 한다.
  #     끊기면 화면이 조용히 낡은 채로 남는다.
  #   - dev 서버는 소스와 소스맵을 그대로 내보내고 타입 오류를 런타임까지 미룬다.
  #     빌드는 `tsc --noEmit` 를 먼저 도므로 타입 오류가 이미지 생성 전에 걸린다.
  #   - dev 서버는 파일이 하나 깨지면 프로세스가 죽는다. 정적 산출물은 그런 자리가 없다.
  # 개발 중에는 이 서비스를 내리고 호스트에서 `npm run dev` 를 쓴다 (deploy/README.md).
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      target: serve
    image: game-frontend:local
    container_name: game-frontend-1
    restart: unless-stopped
    ports:
      # 터널이 여기로 온다. 포트를 바꾸면 Cloudflare 대시보드의 ingress 도 함께 고쳐야 한다.
      - "8090:8090"
    networks:
      - game_net
    # 죽은 컨테이너를 도커가 알아채게 한다. restart: unless-stopped 는 프로세스가
    # 종료됐을 때만 돌지, nginx 가 살아 있는데 응답을 못 하는 상태는 잡지 못한다.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--tries=1", "--timeout=3", "http://127.0.0.1:8090/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── 데이터베이스 ─────────────────────────────────────────────────────────
  # 공개하지 않는다. game_net 안에서만 보이며 backend 만 붙는다.
  postgres:
    image: postgres:16-alpine
    container_name: game-postgres-1
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-game}
      POSTGRES_USER: ${POSTGRES_USER:-game}
      # 기본값을 두지 않는다. 없으면 뜨지 않아야 한다 — 개발용 비밀번호가 배포에
      # 따라가는 것이 이런 기본값에서 시작한다.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 정해야 한다}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - game_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-game} -d ${POSTGRES_DB:-game}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── 백엔드 (검증 서버) ───────────────────────────────────────────────────
  # 클라이언트의 주장을 저장하지 않고 재시뮬해서 확정한다
  # (docs/설계/7_변조방지 §3). 컨테이너명은 edge-proxy 와의 계약이라 바꾸지 않는다.
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    image: game-backend:local
    container_name: game-backend-1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GAME_DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-game}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-game}
    expose:
      - "8000"
    networks:
      - game_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ══ 일회성 도구 — run --rm 으로 부른다 ════════════════════════════════════
  # profiles 로 묶어 두었으므로 up -d 에는 뜨지 않는다. compose run 은 해당
  # 서비스의 프로파일을 자동으로 켜므로 --profile 을 따로 붙일 필요는 없다.

  # 헤드리스 배치 러너. TDD §10 야간 배치, 로드맵 §10 주간 리뷰가 쓴다.
  # 지금은 결정론 자체 점검만 돈다 — 배치 러너는 Phase 1 W3 산출물이고,
  # 생기면 이 command 를 scripts/ 의 러너로 바꾼다.
  sim:
    profiles: ["tools"]
    build:
      <<: *build
      target: runtime
    env_file: [.env]
    volumes:
      - ../volume:/app/volume
    restart: "no"

  # 저장소 전량 게이트. 호스트에 도구를 깔지 않아도 §7.1 의 동일 버전으로 검사한다.
  check:
    profiles: ["tools"]
    build:
      <<: *build
      target: ci
    volumes:
      - ..:/app
    restart: "no"

  # 게이트(§8.5)는 코드 규약만 본다. 골든 리플레이 회귀는 여기서 잡는다 (TDD §10).
  # pytest. DB 를 함께 띄운다 — 서버 검사(test_api_server.py)는 연결이 없으면
  # 건너뛰므로, 여기서 붙여 주지 않으면 그 검사가 조용히 0건이 된다.
  #
  # **DB 를 프로덕션과 가른다.** 예전에는 같은 `game` 을 썼고, 그래서 검사가 만든 계정·
  # 아이템·매물이 실제 서비스에 쌓였다. 계정 69개 중 68개가 검사 잔여였고, 검사용 계정
  # 하나가 **관리자 권한까지 갖고 있었다** — 검사는 관리자 경로를 확인해야 하므로 스스로를
  # 승격시킨다. 그 권한이 프로덕션에 남는 것은 검사의 잘못이 아니라 배치의 잘못이다.
  test:
    profiles: ["tools"]
    build:
      <<: *build
      target: ci
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GAME_DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-game}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_TEST_DB:-game_test}
    networks:
      - game_net
    volumes:
      - ..:/app
    # 검사용 DB 가 없으면 만든다. `apply_schema` 는 표를 만들지만 데이터베이스 자체는
    # 못 만든다 — 그것이 없으면 연결부터 실패한다.
    entrypoint: ["/app/deploy/run-tests.sh"]
    command: ["pytest", "-q"]
    restart: "no"

  # 프로덕션 DB 에 대고 도는 도구. **검사와 갈라 둔다** — `test` 는 game_test 를 보고
  # 이쪽은 실제 DB 를 본다. 두 자리를 한 서비스로 두면 어느 DB 를 건드리는지가 명령줄에
  # 안 남고, 그러면 지우는 명령이 어디에 떨어지는지 모르게 된다.
  #
  #   docker compose run --rm ops uv run python -m scripts.purge_test_accounts
  #   docker compose run --rm ops uv run python -m scripts.grant_admin <아이디>
  ops:
    profiles: ["tools"]
    build:
      <<: *build
      target: ci
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GAME_DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-game}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-game}
    networks:
      - game_net
    volumes:
      - ..:/app
    restart: "no"

  # ── 봇 (가상 유저 열) ────────────────────────────────────────────────────
  #
  # **스택과 함께 뜨고 함께 내려간다.** 호스트 cron 으로 두면 설정이 저장소 밖에 살아서
  # 재설치 때 따라오지 않는다.
  #
  # 백엔드에 **라우트로** 붙는다 — 서비스 계층을 직접 부르면 티켓 1회용·코어버전 대조
  # 같은 규율을 우회하고, 그러면 봇의 런은 「진짜 경로가 도는지」를 증명하지 못한다.
  # `game_net` 안에서만 부르므로 공개 주소를 거치지 않는다.
  #
  # 봇마다 시간당 다섯 판이 상한이고 `bot_profile.next_run_at` 이 그것을 물린다.
  bots:
    build:
      <<: *build
      # **`api` 스테이지를 쓴다.** 거기에 `game/` 과 `scripts/` 가 이미 들어 있고 개발
      # 의존성이 없다 — 상시 도는 프로덕션 프로세스에 uv·pytest·git 을 둘 이유가 없다.
      # `ci` 는 저장소를 바인드 마운트해 쓰는 도구용이라 `scripts/` 가 이미지에 없다.
      target: api
    container_name: game-bots-1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      GAME_DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-game}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-game}
      GAME_API_URL: http://backend:8000
    command: ["python", "-m", "scripts.run_bots"]
    networks:
      - game_net

  # 세계 지킴이 (설계/9_에이전트_운영 §4.1). **에이전트의 첫 수다.**
  #
  # LLM 이 없다 — 질의와 임계값 비교뿐이라 새 의존성이 0개이고, 봇 러너와 같은 이미지로
  # 돈다. **아무것도 안 고친다**: 이상을 로그에 적을 뿐이고, 고치는 것은 사람이다.
  #
  # 백엔드에 안 붙는다. 지킴이가 보는 값들(도플갱어 나이·봇 가방 포화·정비가 남긴 일)은
  # 라우트가 안 내주는 것이라 DB 를 직접 읽는다 — 대신 쓰기 질의를 한 줄도 안 둔다.
  watchdog:
    build:
      <<: *build
      target: api
    container_name: game-watchdog-1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GAME_DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-game}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-game}
    command: ["python", "-m", "scripts.run_watchdog", "--loop"]
    networks:
      - game_net

  # 개발 셸. uv·Python 3.11 을 호스트에 설치하지 않고 동일 환경을 쓴다.
  dev:
    profiles: ["tools"]
    build:
      <<: *build
      target: dev
    env_file: [.env]
    volumes:
      - ..:/app
      - ../volume:/app/volume
    stdin_open: true
    tty: true
    restart: "no"

networks:
  # edge-proxy 가 external 로 조인할 이름. 고정하지 않으면
  # coding-roguelike_game_net 이 되어 edge-proxy 쪽 설정과 어긋난다.
  game_net:
    name: game_net

volumes:
  # DB 데이터. 이름을 고정해 두어야 compose 프로젝트명이 바뀌어도 같은 볼륨을 본다 —
  # 다른 이름으로 붙으면 빈 DB 가 생기고 계정이 통째로 사라진 것처럼 보인다.
  postgres_data:
    name: game_postgres_data
