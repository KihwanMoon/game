# 프런트엔드 서빙. `frontend/dist` 의 정적 산출물을 내보내고 `/api/` 만 백엔드로 넘긴다.
#
# 이 컨테이너가 /api/ 까지 받는 이유:
#   Cloudflare Tunnel 의 ingress 가 stock.nullmovie.com 전체를 host:8090 하나로 보낸다.
#   경로별 분기가 터널 쪽에 없으므로 여기서 나눠야 한다. edge-proxy(:80)를 통해 들어오는
#   경로는 /api/ 를 백엔드로 직접 보내므로 이 절을 타지 않는다 — 두 입구가 같은 결과를
#   내도록 양쪽에 같은 분기를 둔다.
server {
    listen 8090;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 도커 임베디드 DNS. 변수로 받아야 backend 재시작 시 IP 를 다시 해석한다.
    # 고정 이름을 그대로 쓰면 기동 시점에 한 번 굳어 stale 502 가 난다.
    resolver 127.0.0.11 valid=30s ipv6=off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        set $game_backend game-backend-1:8000;
        proxy_pass http://$game_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 틱 스트림(SSE)을 대비해 버퍼링을 끄고 오래 유지한다. 로그 패널이 틱 단위
        # 실시간 갱신을 전제로 한다.
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # vite 가 내용 해시를 파일명에 박는다. 내용이 바뀌면 이름이 바뀌므로 영구 캐시가 안전하다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 진입점 HTML 은 캐시하지 않는다. 캐시되면 새로 배포한 뒤에도 낡은 자산 이름을 가리킨다.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # 확인용 페이지들. /ds.html 부품 카탈로그, /battle.html 전투 렌더러, /hud.html 관전.
    # 실제 파일이므로 try_files 가 그대로 집는다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
