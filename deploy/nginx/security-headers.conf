# 보안 헤더 한 벌.
#
# **`add_header` 는 상속이 아니라 대체다.** 어느 location 에 `add_header` 가 하나라도
# 있으면 그 location 은 상위의 `add_header` 를 **전부 잃는다.** 이 저장소의 location
# 넷이 이미 Cache-Control 을 걸고 있어서, server 블록에만 적어 두면 바로 그 넷에서
# 조용히 사라진다 — 헤더가 있다고 믿는데 정작 정적 자산에는 없는 상태가 된다.
#
# 그래서 파일로 갈라 두고 **쓰는 자리마다 include 한다.** 한 줄이면 빠뜨리기 어렵다.

# 콘텐츠 타입을 브라우저가 멋대로 다시 추측하지 않는다.
add_header X-Content-Type-Options "nosniff" always;

# 틀에 안 끼워진다. 계정 조작(로그아웃·경매 구매·관리자 개입)이 남의 페이지 안에서
# 클릭당하는 것을 막는다. CSP 의 frame-ancestors 와 같은 뜻이고, 옛 브라우저용이다.
add_header X-Frame-Options "DENY" always;

# 밖으로 나갈 때는 출처만 알린다. 경로에는 방 id·시드 같은 것이 실린다.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 안 쓰는 장치는 아예 안 쓴다고 말한다.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# TLS 로만 온다. Cloudflare 가 TLS 를 끊지만 헤더는 브라우저까지 그대로 간다.
# **includeSubDomains 는 안 건다** — 지금 하위 도메인이 www 하나뿐이고, 나중에 평문이
# 필요한 하위 도메인이 생기면 되돌리는 데 max-age 만큼이 걸린다.
add_header Strict-Transport-Security "max-age=31536000" always;

# 콘텐츠 보안 정책.
#
# **브라우저로 확인하고 적었다.** 처음 적은 정책은 `'self'` 만 열어 두었는데, 실제로
# 띄워 보니 **웹폰트가 통째로 막혔다** — 토큰 정본(`design/tokens/fonts.css`)이
# `@import` 로 구글 폰트를 부르고 그것이 번들 CSS 안에 들어간다. 화면은 뜨는데 글꼴만
# 시스템 것으로 떨어지는, 눈으로 안 보면 모르는 종류의 고장이다.
#
# 여는 곳은 셋뿐이고 전부 이유가 있다.
#   - fonts.googleapis.com / fonts.gstatic.com — 표시용 글꼴 (`tokens/fonts.css`)
#   - accounts.google.com — 구글 로그인(GIS)이 문서로 요구하는 자리 (`GoogleSignIn.tsx`)
#   - static.cloudflareinsights.com — Cloudflare 가 스스로 끼워 넣는 계측 조각.
#     우리 코드가 아니지만 막으면 있던 통계가 조용히 끊긴다
#
# script 에는 'unsafe-inline' 을 **안 준다.** 앱이 인라인 스크립트를 안 쓴다.
# style 에는 필요하다 — 첫 화면 스타일이 `index.html` 안에 인라인으로 있다.
# img 의 data: 는 아이템 도트가 data URI 라서다.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self' https://accounts.google.com https://cloudflareinsights.com; frame-src https://accounts.google.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
