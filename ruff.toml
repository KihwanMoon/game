target-version = "py311"

# ruff 는 줄 길이를 **표시 폭**으로 잰다 — 한중일 문자는 2 로 센다.
# 주석·독스트링을 한글로 쓰면 실질 상한이 약 50자다. 짧아 보이는 줄이 E501 로
# 걸리는 이유가 이것이며, 값을 올리는 대신 문장을 나누는 쪽을 권한다.
line-length = 100

# 1장의 예외 경로 중 저장소 밖에서 온 코드. 벤더링 디렉터리·서브모듈처럼
# 우리가 고치지 않는 것을 여기에 적는다. §8.5 의 pydoclint --exclude 와 같은 기준을
# 유지한다 — ruff 만 걸러 두면 게이트의 다른 검사가 그 코드에서 실패한다.
#
# **서브모듈이 있으면 반드시 적는다.** ruff 는 워킹트리를 스캔하므로 서브모듈 코드를
# 그대로 읽는 반면, §8.5 의 check_naming.py 는 git ls-files 기반이라 서브모듈을
# 보지 않는다. 두 검사의 대상 범위가 다르므로, 비워 두면 우리가 고칠 수 없는 코드로
# 게이트가 영구히 막힌다.
#
# .venv 등 gitignore 된 경로는 ruff 가 자동 제외하므로 여기 적지 않아도 된다.
# pydoclint 는 그렇지 않으므로 §8.5 에는 따로 적어야 한다.
#
# 마크다운은 파이썬 저장소 규칙의 대상이 아니다. ruff 0.16 부터 .md 안의 파이썬
# 코드 블록도 포맷 대상이 되는데, 문서의 예제는 좁은 지면에 맞춰 압축해 둔 것이라
# 재포맷하면 읽기 어려워진다.
extend-exclude = ["*.md"]  # + 서브모듈·벤더링 경로. 예: "libcommon", "vendor"

[lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "SIM", "C90", "PL", "ANN"]
ignore = [
    "D203",
    "D213",
    "PLR0913",
    # 인자 수를 위치 인자만 따로 다시 재는 규칙(ruff 0.16 에서 기본 활성). 웹 프레임워크의
    # 라우트 핸들러는 쿼리 파라미터가 곧 인자라 PLR0913 과 같은 이유로 줄일 수 없다.
    # 둘은 한 결정의 두 면이므로 하나만 끄면 결정이 반만 반영된다 (7.1).
    "PLR0917",
    # 독스트링 첫 단어를 대문자로 바꾼다. 자동 수정이 소문자가 정확한 표기인 고유명을
    # 망가뜨린다 — ffmpeg → Ffmpeg, mpegts → Mpegts, ack → Ack.
    # 틀린 문장을 만드는 자동 수정은 규칙을 지키는 것보다 나쁘다 (7장).
    "D403",
    # 저장소가 설계상 피할 수 없는 규칙군은 여기에 사유와 함께 적는다 (11장).
    # 예: 순환참조를 끊는 지연 import 가 광범위하면 "PLC0415".
    # 수백 곳에 억제 주석을 다는 것은 규칙이 아니라 소음이다.
]

[lint.pydocstyle]
convention = "google"

[lint.mccabe]
max-complexity = 10

[lint.per-file-ignores]
# 패키지·서비스 단위로 테스트를 두는 구조에서도 매칭되도록 `**/` 를 앞에 둔다.
# "tests/**/*.py" 로 두면 저장소 루트 바로 아래 tests/ 만 걸러진다.
#
# 테스트에서 의미가 뒤집히는 규칙만 넣는다.
#   PLR2004  assert len(x) == 3 — 기댓값이 곧 매직 넘버다. 상수로 승격하면
#            테스트가 자기 자신을 검증하게 되어 검증력이 사라진다.
#   PLC0415  픽스처·모킹의 지연 import 는 표준 패턴이다. 모듈 상단으로 올리면
#            모킹 시점이 어긋난다.
#   N802 · N812 · PLC2401
#            동작을 서술하는 것이 테스트 이름의 목적이다(비ASCII 이름 포함).
# E501 · SIM · C90 은 넣지 않는다 — 테스트도 읽기 쉬워야 하고, 그쪽은
# 테스트라서 정상이 되는 종류가 아니다.
"**/tests/**/*.py" = ["D", "ANN", "PLR2004", "PLC0415", "N802", "N812", "PLC2401"]
"**/__init__.py" = ["F401"]

# 마이그레이션은 생성 도구의 템플릿 형식을 유지해야 하므로 직접 편집을 최소화한다 (1장).
# 무시 목록은 사용하는 마이그레이션 도구가 만드는 코드 형식에 맞춰 조정한다.
"**/migrations/**/*.py" = ["D", "ANN", "E501", "UP007", "UP035", "I001"]

# 자동 생성 코드 (1장). 저장소에 없으면 이 줄은 지운다.
"**/*_pb2.py" = ["ALL"]
